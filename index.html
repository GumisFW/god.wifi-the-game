<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>god.wifi</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      
      background-color: #0a0a0a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      perspective: 1000px; 
    }

    .spinning-logo {
      width: 80%;
      max-width: 400px;
      animation: spin3D 10s linear infinite;
     
      margin-bottom: 120px; 
    }

    @keyframes spin3D {
      0% {
        transform: rotateY(0deg);
      }
      100% {
        transform: rotateY(360deg);
      }
    }

    .question-mark {
      color: #ffffff;
      font-size: 6rem;
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.3s ease, text-shadow 0.3s ease;
    }

    .question-mark:hover {
      transform: scale(1.2);
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>

  <img src="logo god.wifi biale (1).png" alt="god.wifi logo" class="spinning-logo">

  <a href="https://goodwifey2027.pl" class="question-mark">?</a>

</body>
</html>
